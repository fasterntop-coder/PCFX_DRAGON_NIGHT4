name: PS4 Beetle PC-FX Core

on:
  push:
    branches: [ps4-pkg-build]
    paths:
      - '.github/workflows/ps4_pcfx_core.yml'
      - 'ps4_build/**'
  workflow_dispatch:

jobs:
  build-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make wget tar git

      - name: Download OpenOrbis v0.5.4
        run: |
          wget -q https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
          echo '3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  toolchain-llvm-18.tar.gz' | sha256sum -c -
          tar xzf toolchain-llvm-18.tar.gz
          echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain" >> "$GITHUB_ENV"

      - name: Clone Beetle PC-FX
        run: |
          git clone --depth 1 https://github.com/libretro/beetle-pcfx-libretro.git beetle-pcfx
          git -C beetle-pcfx rev-parse HEAD

      - name: Add OpenOrbis static platform and support sources
        run: |
          python3 -c 'from pathlib import Path; p=Path("beetle-pcfx/Makefile"); s=p.read_text(); marker="# Lightweight PS3 Homebrew SDK\n"; block="# PlayStation 4 (OpenOrbis) - standalone static libretro core\nelse ifeq ($(platform), orbis)\n   TARGET := $(TARGET_NAME)_libretro_orbis.a\n   CC = clang\n   CXX = clang++\n   AR = llvm-ar\n   STATIC_LINKING = 1\n   HAVE_CDROM = 0\n   PTHREAD_FLAGS =\n   fpic := -fPIC\n   ORBIS_COMMON := --target=x86_64-pc-freebsd12-elf -isysroot $(OO_PS4_TOOLCHAIN) -isystem $(OO_PS4_TOOLCHAIN)/include -DORBIS -D__ORBIS__\n   CFLAGS += $(ORBIS_COMMON)\n   CXXFLAGS += $(ORBIS_COMMON) -isystem $(OO_PS4_TOOLCHAIN)/include/c++/v1 -stdlib=libc++ -std=gnu++11\n\n"; assert marker in s; s=s.replace(marker,block+marker,1); inc="include Makefile.common\n"; support="\nifeq ($(platform), orbis)\nSOURCES_C += $(LIBRETRO_COMM_DIR)/streams/file_stream.c $(LIBRETRO_COMM_DIR)/streams/file_stream_transforms.c $(LIBRETRO_COMM_DIR)/file/file_path.c $(LIBRETRO_COMM_DIR)/file/retro_dirent.c $(LIBRETRO_COMM_DIR)/lists/string_list.c $(LIBRETRO_COMM_DIR)/lists/dir_list.c $(LIBRETRO_COMM_DIR)/compat/compat_strl.c $(LIBRETRO_COMM_DIR)/compat/compat_snprintf.c $(LIBRETRO_COMM_DIR)/compat/compat_posix_string.c $(LIBRETRO_COMM_DIR)/compat/compat_strcasestr.c $(LIBRETRO_COMM_DIR)/compat/fopen_utf8.c $(LIBRETRO_COMM_DIR)/encodings/encoding_utf.c $(LIBRETRO_COMM_DIR)/encodings/encoding_crc32.c $(LIBRETRO_COMM_DIR)/vfs/vfs_implementation.c $(LIBRETRO_COMM_DIR)/memmap/memalign.c $(LIBRETRO_COMM_DIR)/string/stdstring.c $(LIBRETRO_COMM_DIR)/time/rtime.c\nendif\n"; assert inc in s; p.write_text(s.replace(inc,inc+support,1))'
          grep -n -A14 'PlayStation 4' beetle-pcfx/Makefile
          grep -n -A3 'SOURCES_C +=.*file_stream' beetle-pcfx/Makefile

      - name: Build static Beetle PC-FX core
        run: |
          set -o pipefail
          make -C beetle-pcfx platform=orbis -j2 2>&1 | tee beetle-build.log
          file beetle-pcfx/mednafen_pcfx_libretro_orbis.a
          ls -lh beetle-pcfx/mednafen_pcfx_libretro_orbis.a
          sha256sum beetle-pcfx/mednafen_pcfx_libretro_orbis.a | tee core.sha256

      - name: Upload core diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dk4-ps4-pcfx-core
          if-no-files-found: warn
          path: |
            beetle-build.log
            core.sha256
            beetle-pcfx/mednafen_pcfx_libretro_orbis.a
          retention-days: 7

      - name: Upload OpenOrbis v0.5.4 toolchain archive
        uses: actions/upload-artifact@v4
        with:
          name: openorbis-v054-toolchain
          compression-level: 0
          path: toolchain-llvm-18.tar.gz
          retention-days: 1
